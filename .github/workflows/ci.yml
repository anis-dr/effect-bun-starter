name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Same image and locale as compose.yaml (ADR 0017), on the port .env.example uses.
      # No mail service: the API tests send through a recording Mailer and store
      # uploads in a temporary directory (apps/api/test/test-app.ts).
      database:
        image: postgres:18
        env:
          POSTGRES_DB: effect_bun_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale-provider=libc --locale=en_US.UTF-8
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d effect_bun_starter" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: bun run --cwd packages/database db:migrate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --cwd apps/web build
