services:
  database:
    image: postgres:18-alpine
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: effect_bun_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d effect_bun_starter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  database-data:
